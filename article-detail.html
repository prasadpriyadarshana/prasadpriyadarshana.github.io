                readTime: '5 min read',
                title: 'Scaling React Applications',
                desc: 'An in-depth look at state management and component architecture for large-scale apps.',
                tags: ['Engineering', 'React', 'Architecture', 'Frontend'],
                content: `
                    <h2>Why scale matters</h2>
                    <p>As React apps grow, state boundaries, bundle size, and render patterns become the main bottlenecks. Planning folder structure and data flow early saves costly refactors later.</p>
                    <p>The key insight is that scaling isn't just about handling more users — it's about maintaining developer velocity as the codebase grows. A well-architected application allows teams to work independently on features without stepping on each other's toes.</p>

                    <h2>Practical patterns</h2>
                    <p>Use feature-based modules, colocate hooks with UI, and prefer composition over prop drilling. Tools like React Query or Zustand can simplify server and client state when used with clear conventions.</p>
                    <p>The most impactful patterns I've found are:</p>
                    <ul>
                        <li><strong>Feature slices:</strong> Group all code for a feature (components, hooks, utils, tests) in one directory</li>
                        <li><strong>Barrel exports:</strong> Each feature exposes a clean public API through an index file</li>
                        <li><strong>Shared kernel:</strong> Common utilities and UI components live in a shared layer</li>
                        <li><strong>Dependency rules:</strong> Features can import from shared, but never from each other</li>
                    </ul>

                    <h2>Takeaways</h2>
                    <p>Measure before optimizing, document architectural decisions, and keep components focused on a single responsibility. The best architectures are the ones your team can actually follow consistently.</p>
                `
            },
            'psychology-of-blue': {
                date: 'April 2026',
                readTime: '4 min read',
                title: 'The Psychology of Blue',
                desc: 'Why modern tech brands gravitate towards blue palettes and glowing accents.',
                tags: ['Design', 'UI/UX', 'Color Theory', 'Branding'],
                content: `
                    <h2>Trust and clarity</h2>
                    <p>Blue is associated with reliability and professionalism, which makes it a natural fit for technology products that need to feel capable and calm. There's a reason Facebook, LinkedIn, Twitter, and IBM all chose blue as their primary brand color.</p>
                    <p>Research in color psychology consistently shows that blue evokes feelings of trust, security, and competence — exactly what tech companies want users to feel when interacting with their products.</p>

                    <h2>Digital interfaces</h2>
                    <p>On dark UIs, blue accents provide contrast without the aggression of red or the fatigue of pure white highlights. Subtle glow effects reinforce hierarchy and interactivity.</p>
                    <p>The key principles for using blue in interfaces:</p>
                    <ul>
                        <li><strong>Hierarchy:</strong> Use brighter blues for primary actions, muted blues for secondary elements</li>
                        <li><strong>Contrast:</strong> Blue on dark backgrounds creates a natural focal point without overwhelming</li>
                        <li><strong>Consistency:</strong> A single blue hue with varied opacity creates cohesion across components</li>
                    </ul>

                    <h2>Using color intentionally</h2>
                    <p>Pair accent blue with neutral grays, limit saturation in body text areas, and reserve the brightest blues for calls to action and focus states. The goal is to guide the eye, not overwhelm it.</p>
                `
            }
