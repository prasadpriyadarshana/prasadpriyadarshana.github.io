<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Prasad's AI - Prasad Priyadarshana</title>
    <meta name="description" content="Ask questions about Prasad's experience, skills, projects, and certifications.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        .chat-page {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            padding: 0;
            overflow: hidden;
        }

        .chat-page-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--divider);
            flex-shrink: 0;
        }

        .chat-page-header a {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .chat-page-header a:hover {
            border-color: var(--emerald);
            color: var(--emerald);
        }

        .chat-page-title {
            font-family: 'Fustat', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .chat-page-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'DM Mono', monospace;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            scrollbar-width: thin;
            scrollbar-color: #e2e8f0 transparent;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .chat-welcome {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .chat-welcome h2 {
            font-family: 'Fustat', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .chat-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1.5rem;
        }

        .chat-chip {
            padding: 0.5rem 1rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-family: 'DM Mono', monospace;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chat-chip:hover {
            border-color: var(--emerald);
            color: var(--emerald);
            background: rgba(5, 150, 105, 0.05);
        }

        .chat-msg {
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
            animation: msg-in 0.3s ease-out;
        }

        @keyframes msg-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-msg-user {
            flex-direction: row-reverse;
        }

        .chat-msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: var(--emerald);
            display: grid;
            place-items: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .chat-msg-user .chat-msg-avatar {
            background: var(--text);
        }

        .chat-msg-bubble {
            max-width: 75%;
            padding: 0.9rem 1.15rem;
            border-radius: 16px;
            font-size: 0.925rem;
            line-height: 1.65;
            word-break: break-word;
        }

        .chat-msg-user .chat-msg-bubble {
            background: var(--text);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .chat-msg-assistant .chat-msg-bubble {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .typing-dots {
            display: inline-flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: var(--emerald);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
            opacity: 0.6;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--divider);
            flex-shrink: 0;
            background: var(--bg);
        }

        .chat-input {
            flex: 1;
            padding: 0.85rem 1.25rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.925rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input::placeholder {
            color: var(--tag-text);
        }

        .chat-input:focus {
            border-color: var(--emerald);
        }

        .chat-send {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--emerald);
            border: none;
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .chat-send:hover {
            background: #047857;
            transform: scale(1.05);
        }

        .chat-input:disabled,
        .chat-send:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="chat-page">
        <div class="chat-page-header">
            <a href="index.html" aria-label="Back to portfolio"><i class="fa-solid fa-arrow-left"></i></a>
            <div>
                <div class="chat-page-title">Ask Prasad's AI</div>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="chat-welcome">
                <h2>Hi there! <span style="display:inline-block; animation: wave-hand 1.5s ease-in-out 2;">&#128075;</span></h2>
                <p>I'm Prasad's AI assistant. I know his full CV — work experience, projects, certifications, and technical skills. Ask me anything!</p>
                <div class="chat-suggestions" id="chat-suggestions">
                    <button class="chat-chip" data-msg="What's Prasad's work experience?">Work experience</button>
                    <button class="chat-chip" data-msg="What certifications does Prasad have?">Certifications</button>
                    <button class="chat-chip" data-msg="Tell me about his key projects">Projects</button>
                    <button class="chat-chip" data-msg="What technical skills does Prasad have?">Tech skills</button>
                    <button class="chat-chip" data-msg="How can I contact Prasad?">Contact info</button>
                </div>
            </div>
        </div>

        <form class="chat-input-area" id="chat-form">
            <input type="text" class="chat-input" id="chat-input" placeholder="Ask about experience, skills, projects..." autocomplete="off">
            <button type="submit" class="chat-send" id="chat-send" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
    </div>

    <script>
    (function() {
        const WORKER_URL = 'https://prasad-portfolio-chat.prasad-portfolio-chat.workers.dev';

        const messages = [];
        let isLoading = false;

        const form = document.getElementById('chat-form');
        const input = document.getElementById('chat-input');
        const messagesEl = document.getElementById('chat-messages');
        const suggestions = document.getElementById('chat-suggestions');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text || isLoading) return;
            input.value = '';
            sendMessage(text);
        });

        suggestions.querySelectorAll('.chat-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                if (!isLoading) sendMessage(chip.dataset.msg);
            });
        });

        function addMessage(role, content) {
            messages.push({ role, content });
            if (suggestions && role === 'user') {
                suggestions.parentElement.style.display = 'none';
            }

            const div = document.createElement('div');
            div.className = 'chat-msg chat-msg-' + role;

            if (role === 'assistant') {
                div.innerHTML = '<div class="chat-msg-avatar">P</div><div class="chat-msg-bubble">' + formatMsg(content) + '</div>';
            } else {
                div.innerHTML = '<div class="chat-msg-avatar"><i class="fa-solid fa-user" style="font-size:0.7rem"></i></div><div class="chat-msg-bubble">' + escapeHtml(content) + '</div>';
            }

            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'chat-msg chat-msg-assistant chat-typing';
            div.innerHTML = '<div class="chat-msg-avatar">P</div><div class="chat-msg-bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div>';
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div;
        }

        async function sendMessage(text) {
            addMessage('user', text);
            isLoading = true;
            input.disabled = true;

            const typing = addTyping();

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messages.map(m => ({ role: m.role, content: m.content })) }),
                });
                const data = await res.json();
                typing.remove();
                addMessage('assistant', data.reply || 'Sorry, something went wrong.');
            } catch (err) {
                typing.remove();
                addMessage('assistant', 'Unable to connect. Please check your internet and try again.');
            }

            isLoading = false;
            input.disabled = false;
            input.focus();
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function formatMsg(text) {
            return escapeHtml(text)
                .replace(/\*\*(.*?)\*\*/g, '<strong style="color:#047857;font-weight:600">$1</strong>')
                .replace(/\*(.*?)\*/g, '<em style="color:#059669">$1</em>')
                .replace(/`(.*?)`/g, '<code style="background:#ecfdf5;color:#047857;padding:2px 5px;border-radius:4px;font-size:0.85em">$1</code>')
                .replace(/^[\*\-•] (.+)/gm, '<li style="margin:4px 0;margin-left:1.2em;list-style:disc">$1</li>')
                .replace(/^\d+\. (.+)/gm, '<li style="margin:4px 0;margin-left:1.2em;list-style:decimal">$1</li>')
                .replace(/((?:<li[^>]*>.*<\/li>\s*)+)/g, '<ul style="padding-left:0.5em;margin:8px 0">$1</ul>')
                .replace(/\n/g, '<br>');
        }
    })();
    </script>

    <style>
        @keyframes wave-hand {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            50% { transform: rotate(-10deg); }
            75% { transform: rotate(15deg); }
        }
    </style>
</body>

</html>
